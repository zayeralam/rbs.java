name: Java compile check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compile:
    name: Compile on Java 8
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '8'

      - name: Verify Java installation
        run: java -version

      - name: Compile source
        run: javac RestaurantBillingSystem.java

      - name: Clean compiled files
        if: always()
        run: rm -f *.class
